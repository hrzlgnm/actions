[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    ".git/"
]

[default]
check-filename = true
extend-ignore-re = [
    "digest to [0-9a-f]+", # docker digests in changelog entries
    "(?i)AUR_SSH_FPS=\"[^\"]*\"", # pinned Arch-published AUR SSH host key fingerprints must stay byte-exact
]

[default.extend-words]
alls = "alls" # used by re-actors/alls-green action
