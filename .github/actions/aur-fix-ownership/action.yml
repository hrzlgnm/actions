name: Fix AUR checkout ownership
description: Chown the checkout to runner (AUR builder containers run as root)

# Consumers pin this action directly, e.g.
#   uses: hrzlgnm/actions/.github/actions/aur-fix-ownership@<sha> # v2.11.0

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: '"$ACTION_DIR/fix-ownership.sh"'
