name: Clone AUR repo
description: Clone the AUR package repository to ~/aur, discarding any previous checkout

# Consumers pin this action directly, e.g.
#   uses: hrzlgnm/actions/.github/actions/aur-clone-repo@<sha> # v2.11.0

inputs:
  package-name:
    description: AUR package name, e.g. mdns-browser or mdns-browser-bin
    required: true

runs:
  using: composite
  steps:
    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        ACTION_DIR: ${{ github.action_path }}
        PACKAGE_NAME: ${{ inputs.package-name }}
      with:
        timeout_minutes: 5
        max_attempts: 5
        retry_wait_seconds: 10
        warning_on_retry: true
        # su without --login keeps the step env and only resets
        # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
        command: su runner -c '"$ACTION_DIR/clone-aur-repo.sh"'
