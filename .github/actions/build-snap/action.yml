name: Build snap
description: Builds the snap with snapcraft inside LXD
inputs:
  verbosity:
    description: snapcraft verbosity level
    required: false
    default: brief
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERBOSITY: ${{ inputs.verbosity }}
      run: |
        set -euo pipefail
        sudo snapcraft pack --use-lxd --verbosity="$VERBOSITY"
