name: Setup AUR SSH deployment key
description: Install the AUR SSH deploy key and pin aur.archlinux.org host keys

# Consumers pin this action directly, e.g.
#   uses: hrzlgnm/actions/.github/actions/aur-setup-ssh@<sha> # v2.11.0

inputs:
  deploy-key:
    description: SSH private key for the aur.archlinux.org service user
    required: true

runs:
  using: composite
  steps:
    - name: Check deploy key is configured
      shell: bash
      env:
        AUR_DEPLOY_KEY: ${{ inputs.deploy-key }}
      # Plain step on purpose: a missing key must fail immediately instead
      # of burning all retry attempts below.
      run: |
        if [[ -z "${AUR_DEPLOY_KEY:-}" ]]; then
          echo "::error::AUR_DEPLOY_KEY secret is not set. Please configure the AUR SSH deploy key in repository settings." >&2
          exit 1
        fi

    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        ACTION_DIR: ${{ github.action_path }}
        AUR_DEPLOY_KEY: ${{ inputs.deploy-key }}
      with:
        timeout_minutes: 5
        max_attempts: 5
        retry_wait_seconds: 10
        warning_on_retry: true
        # su without --login keeps the step env and only resets
        # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
        command: su runner -c '"$ACTION_DIR/setup-aur-ssh.sh"'
