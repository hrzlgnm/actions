name: Setup AUR packaging
description: Fix checkout ownership, install the AUR SSH key, clone the AUR repo, and verify the version

# Consumers pin this action directly, e.g.
#   uses: hrzlgnm/actions/.github/actions/aur-setup@<sha> # v2.12.0
#
# Runs all steps in the caller's job (same container and filesystem), so the
# checkout ownership, ~/.ssh keys, and ~/aur clone are visible to later steps.

inputs:
  package-name:
    description: AUR package name, e.g. mdns-browser or mdns-browser-bin
    required: true
  release-version:
    description: Release version, e.g. 1.13.0
    required: true
  deploy-key:
    description: SSH private key for the aur.archlinux.org service user
    required: true

outputs:
  needs_update:
    description: Whether the AUR package needs an update ('true' when the release is newer, 'false' when already published or ahead)
    value: ${{ steps.check-version.outputs.needs_update }}

runs:
  using: composite
  steps:
    - name: Check deploy key is configured
      shell: bash
      env:
        AUR_DEPLOY_KEY: ${{ inputs.deploy-key }}
      # Plain step on purpose: a missing key must fail immediately instead
      # of burning all retry attempts below.
      run: |
        if [[ -z "${AUR_DEPLOY_KEY:-}" ]]; then
          echo "::error::AUR_DEPLOY_KEY secret is not set. Please configure the AUR SSH deploy key in repository settings."
          exit 1
        fi

    - shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: '"$ACTION_DIR/fix-ownership.sh"'

    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        ACTION_DIR: ${{ github.action_path }}
        AUR_DEPLOY_KEY: ${{ inputs.deploy-key }}
      with:
        timeout_minutes: 5
        max_attempts: 5
        retry_wait_seconds: 10
        warning_on_retry: true
        # su without --login keeps the step env and only resets
        # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
        command: su runner -c '"$ACTION_DIR/setup-aur-ssh.sh"'

    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        ACTION_DIR: ${{ github.action_path }}
        PACKAGE_NAME: ${{ inputs.package-name }}
      with:
        timeout_minutes: 5
        max_attempts: 5
        retry_wait_seconds: 10
        warning_on_retry: true
        # su without --login keeps the step env and only resets
        # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
        command: su runner -c '"$ACTION_DIR/clone-aur-repo.sh"'

    - id: check-version
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        RELEASE_VERSION: ${{ inputs.release-version }}
      # su without --login keeps the step env and only resets
      # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
      # The check runs as runner (owner of ~/aur); the GITHUB_OUTPUT file
      # may be root-owned in the container, so make it writable first while
      # still root.
      run: |
        chmod a+w "${GITHUB_OUTPUT}"
        su runner -c '"$ACTION_DIR/check-aur-version.sh"'
