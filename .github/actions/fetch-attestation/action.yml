name: Fetch attestation bundle
description: >
  Download an upstream release asset and its SLSA build-provenance
  attestation bundle + Sigstore trusted root into the project directory, so a
  `snapcraft --use-lxd` build can verify the binary offline (no token inside
  the container). Outputs are written under $GITHUB_WORKSPACE, which the LXD
  build mounts.
inputs:
  repo:
    description: owner/repo that published the attestation, e.g. hrzlgnm/zux
    required: true
  asset:
    description: release asset filename to fetch the attestation for
    required: true
  tag:
    description: >
      release tag to fetch; if empty, read from snap/snapcraft.yaml's
      source-tag (set by the pin-upstream-tag step)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch attestation bundle
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        ATTESTATION_REPO: ${{ inputs.repo }}
        ATTESTATION_ASSET: ${{ inputs.asset }}
        ATTESTATION_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        tag="$ATTESTATION_TAG"
        if [ -z "$tag" ]; then
          tag="$(grep -oP 'source-tag: \K\S+' snap/snapcraft.yaml)"
        fi
        url="https://github.com/${ATTESTATION_REPO}/releases/download/${tag}/${ATTESTATION_ASSET}"
        curl -fsSL -o /tmp/"$ATTESTATION_ASSET" "$url"
        gh attestation download /tmp/"$ATTESTATION_ASSET" -R "$ATTESTATION_REPO"
        gh attestation trusted-root > trusted_root.jsonl
