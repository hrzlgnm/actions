name: Check AUR version
description: Fail unless the release version is strictly higher than the pkgver in ~/aur

# Consumers pin this action directly, e.g.
#   uses: hrzlgnm/actions/.github/actions/aur-check-version@<sha> # v2.11.0

inputs:
  release-version:
    description: Release version, e.g. 1.13.0
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        RELEASE_VERSION: ${{ inputs.release-version }}
      # su without --login keeps the step env and only resets
      # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
      run: su runner -c '"$ACTION_DIR/check-aur-version.sh"'
