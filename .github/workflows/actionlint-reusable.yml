name: "Actionlint Reusable"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  actionlint:
    name: "🔍 Validate Workflows"
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🛠️ Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actionlint version: v1.7.12
          ACTIONLINT_VERSION="v1.7.12"

          # Download checksums file and extract SHA256 for linux_amd64
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern '*checksums*' -D /tmp/actionlint
          EXPECTED_SHA256=$(grep "_linux_amd64.tar.gz" /tmp/actionlint/*checksums*.txt | awk '{print $1}')

          # Download actionlint binary
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern '*_linux_amd64.tar.gz' -D /tmp/actionlint

          # Verify checksum
          ACTUAL_SHA256=$(sha256sum /tmp/actionlint/*.tar.gz | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Checksum mismatch! Expected: $EXPECTED_SHA256, Got: $ACTUAL_SHA256"
            exit 1
          fi

          # Extract and install
          tar -xzf /tmp/actionlint/*.tar.gz -C /tmp/actionlint
          mkdir -p "$HOME/.local/bin"
          mv /tmp/actionlint/actionlint "$HOME/.local/bin/"
          rm -rf /tmp/actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 🔍 Validate workflows
        run: |
          actionlint .github/workflows/*.yml
