name: "Actionlint Reusable"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  actionlint:
    name: "🔍 Validate Workflows"
    runs-on: ubuntu-slim
    permissions:
      contents: read # needed to checkout repository
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🛠️ Install actionlint
        # NOTE: do not use ./.github/actions/retry here: in a reusable
        # workflow ./. resolves to the caller's checkout, which may not
        # contain the wrapper. Use the pinned remote action directly so
        # consumers stay green when bumping this reusable workflow.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: |
            # actionlint version: v1.7.12
            ACTIONLINT_VERSION="v1.7.12"
            # Pinned SHA256 of actionlint_1.7.12_linux_amd64.tar.gz.
            # Release-asset exception: tags are mutable, so when bumping
            # ACTIONLINT_VERSION you must also update EXPECTED_SHA256 from
            # the new release's checksums file.
            EXPECTED_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

            # Download actionlint binary
            gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern '*_linux_amd64.tar.gz' -D /tmp/actionlint --clobber

            # Verify checksum
            ACTUAL_SHA256=$(sha256sum /tmp/actionlint/*.tar.gz | awk '{print $1}')
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "ERROR: Checksum mismatch! Expected: $EXPECTED_SHA256, Got: $ACTUAL_SHA256"
              exit 1
            fi

            # Extract and install
            tar -xzf /tmp/actionlint/*.tar.gz -C /tmp/actionlint
            mkdir -p "$HOME/.local/bin"
            mv /tmp/actionlint/actionlint "$HOME/.local/bin/"
            rm -rf /tmp/actionlint
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 🔍 Validate workflows
        run: |
          actionlint .github/workflows/*.yml
