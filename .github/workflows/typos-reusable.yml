name: "Reusable ci typos workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  typos:
    name: 📝
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 📝 Check spelling using typos-action
        uses: crate-ci/typos@7c572958218557a3272c2d6719629443b5cc26fd # v1.45.2
