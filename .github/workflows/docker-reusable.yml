name: Build Changed Dockerfiles

on:
  workflow_call:
    inputs:
      branch:
        type: string
        description: The branch name we are building, eg 'main'
        required: true
  workflow_dispatch:

jobs:
  changed-dockerfiles:
    name: 🔍 Dockerfiles
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Filter changed Dockerfiles
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          list-files: json
          filters: |
            dockerfiles:
              - added|modified: '.github/docker/*/Dockerfile'

      - name: 🧩 Extract package names
        id: packages
        run: |
          paths='${{ steps.filter.outputs.dockerfiles_files }}'

          names=$(echo "$paths" \
            | jq -r '.[] | split("/") | .[2]' \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "packages=$names" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changed-dockerfiles
    if: ${{ needs.changed-dockerfiles.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changed-dockerfiles.outputs.packages) }}

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔐 Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Build and 🚀 push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker/${{ matrix.package }}
          file: .github/docker/${{ matrix.package }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ inputs.branch == 'main' && 'v1' || 'dev' }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ inputs.branch == 'main' && 'latest' || 'dev-latest' }}
