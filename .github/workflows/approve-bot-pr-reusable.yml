name: "✅ Approve Bot PR Workflows (Reusable)"

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
        description: "Head branch of the github-actions[bot] PR whose workflow runs should be approved"
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
        default: release-please--branches--main
        description: "Head branch of the github-actions[bot] PR whose workflow runs should be approved"

permissions:
  actions: write # needed to approve and delete workflow runs
  contents: read # needed to list workflow runs and PR files
  pull-requests: read # needed to look up PRs and their files

concurrency:
  group: approve-bot-pr-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-slim
    steps:
      - name: ✅ Approve workflow runs on github-actions[bot] PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_BRANCH: ${{ inputs.branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.PR_BRANCH;
            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            const pr = pulls[0];
            if (!pr) {
              core.warning(`No open PR found for branch ${branch}, nothing to approve`);
              return;
            }
            const prNumber = pr.number;
            let headSha = pr.head.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const hasWorkflowChanges = (fileList) =>
              fileList.length === 3000 ||
              fileList.some((f) => f.filename.startsWith('.github/workflows/'));
            if (hasWorkflowChanges(files)) {
              core.warning(`Skipping: PR #${prNumber} has unverified or modified workflow files`);
              return;
            }
            core.info(`Waiting for and approving latest workflow runs for PR #${prNumber} (head ${headSha})`);
            const deadline = Date.now() + 5 * 60 * 1000;
            let approved = 0;
            let deleted = 0;
            while (Date.now() < deadline) {
              try {
                const { data: freshPr } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                });
                if (freshPr.head.sha !== headSha) {
                  headSha = freshPr.head.sha;
                  approved = 0;
                  core.info(`PR #${prNumber} head moved to ${headSha}, re-checking files`);
                  const freshFiles = await github.paginate(github.rest.pulls.listFiles, {
                    owner, repo, pull_number: prNumber, per_page: 100,
                  });
                  if (hasWorkflowChanges(freshFiles)) {
                    core.warning(`Skipping: PR #${prNumber} has unverified or modified workflow files`);
                    return;
                  }
                }
              } catch (err) {
                core.warning(`Failed to refresh PR #${prNumber}: ${err.message}`);
              }
              const allRuns = (await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, branch, event: 'pull_request', per_page: 100 },
                (response) => response.data.workflow_runs,
              )) ?? [];
              const headRuns = (Array.isArray(allRuns) ? allRuns : []).filter(
                (run) => run?.head_sha === headSha,
              );
              if (headRuns.length === 0) {
                core.info(`No workflow runs yet for head ${headSha}, waiting...`);
                await new Promise((r) => setTimeout(r, 10000));
                continue;
              }
              const runs = (await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, branch, event: 'pull_request', status: 'action_required', per_page: 100 },
                (response) => response.data.workflow_runs,
              )) ?? [];
              const pending = (Array.isArray(runs) ? runs : []).filter(
                (run) =>
                  run?.triggering_actor?.login === 'github-actions[bot]' &&
                  run?.pull_requests?.[0]?.number === prNumber,
              );
              const current = pending.filter((run) => run?.head_sha === headSha);
              try {
                const { data: recheckedPr } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                });
                if (recheckedPr.head.sha !== headSha) {
                  headSha = recheckedPr.head.sha;
                  approved = 0;
                  core.info(`PR #${prNumber} head moved to ${headSha} during scan, discarding run snapshot`);
                  const recheckedFiles = await github.paginate(github.rest.pulls.listFiles, {
                    owner, repo, pull_number: prNumber, per_page: 100,
                  });
                  if (hasWorkflowChanges(recheckedFiles)) {
                    core.warning(`Skipping: PR #${prNumber} has unverified or modified workflow files`);
                    return;
                  }
                  continue;
                }
              } catch (err) {
                core.warning(`Failed to revalidate PR #${prNumber} head: ${err.message}`);
                continue;
              }
              for (const run of pending) {
                if (run.head_sha !== headSha) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                    deleted++;
                    core.info(`Deleted stale run ${run.id} (head ${run.head_sha}, latest ${headSha})`);
                  } catch (err) {
                    core.warning(`Failed to delete stale run ${run.id}: ${err.message}`);
                  }
                }
              }
              for (const run of current) {
                try {
                  await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                  approved++;
                  core.info(`Approved run ${run.id} for PR #${prNumber} (head ${headSha})`);
                } catch (err) {
                  core.warning(`Failed to approve run ${run.id}: ${err.message}`);
                }
              }
              if (approved > 0 && current.length === 0) {
                core.info(`No more pending runs for latest head ${headSha} after approving ${approved}, done`);
                break;
              }
              if (pending.length === 0) {
                core.info(`No action_required runs for head ${headSha}, done`);
                break;
              }
              await new Promise((r) => setTimeout(r, 10000));
            }
            core.info(`Approved ${approved} workflow run(s) and deleted ${deleted} stale run(s) for PR #${prNumber} (head ${headSha})`);
