name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # measure against bitrot
  # also rotates docker images monthly, by pushing new docker images
  # the rotation will happen by renovate
  # rotate the images at the end of the 3th quarter of the month,
  # to avoid duplicate rotations at the beginning/middle of the month,
  # as the source docker images are also mostly rotated once a month
  schedule:
    - cron: "0 0 21 * *"

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-slim
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      workflows: ${{ steps.filter.outputs.lint }}
    steps:
      - name: ⏳ Wait for release workflow to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for in-progress release runs..."
          for _ in $(seq 1 40); do
            RUNS=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?status=in_progress&per_page=10" \
              --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | .id]')
            COUNT=$(echo "$RUNS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              echo "No pending release runs, proceeding"
              break
            fi
            echo "Waiting for $COUNT release run(s): $(echo "$RUNS" | jq -c '.') — sleeping 15s..."
            sleep 15
          done
          if [ "$COUNT" -gt 0 ]; then
            echo "Timed out waiting for release runs to complete"
            exit 1
          fi

      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Check for changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/*.yml'

      - name: Output branch name
        id: branch
        run: |
          echo "branch=${{ env.BRANCH_NAME }}" >> "$GITHUB_OUTPUT"

  label-pr:
    if: github.event_name == 'pull_request'
    name: "🏷️ Label PR"
    permissions:
      contents: read # Needed to read repository contents
      pull-requests: write # Needed to apply labels
      issues: write # Needed to create non existing labels
    runs-on: ubuntu-slim

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml

  typos:
    uses: ./.github/workflows/typos-reusable.yml

  actionlint:
    uses: ./.github/workflows/actionlint-reusable.yml

  all-required-green: # This job does nothing and is only used for the branch protection
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - label-pr
      - actionlint
      - typos
    if: always()
    steps:
      - name: Check whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            label-pr,
            docker
          jobs: ${{ toJSON(needs) }}
