name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # measure against bitrot
  # also rotates docker images monthly, by pushing new docker images
  # the rotation will happen by renovate
  # rotate the images at the end of the 3th quarter of the month,
  # to avoid duplicate rotations at the beginning/middle of the month,
  # as the source docker images are also mostly rotated once a month
  schedule:
    - cron: "0 0 21 * *"

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-slim
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      workflows: ${{ steps.filter.outputs.lint }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/*.yml'

      - name: Output branch name
        id: branch
        run: |
          echo "branch=${{ env.BRANCH_NAME }}" >> "$GITHUB_OUTPUT"

  typos:
    uses: ./.github/workflows/typos-reusable.yml

  actionlint:
    uses: ./.github/workflows/actionlint-reusable.yml

  shell-lint:
    needs: [actionlint]
    strategy:
      fail-fast: false
      matrix:
        scripts-dir:
          - .github/fixtures/shell-lint
          - .github/actions/aur-setup
          - .github/actions/aur-makepkg-lint
    uses: ./.github/workflows/shell-lint-reusable.yml
    with:
      runs-on: ubuntu-latest
      scripts-dir: ${{ matrix.scripts-dir }}

  shell-test:
    needs: [actionlint]
    runs-on: ubuntu-slim
    permissions:
      contents: read # Needed to checkout code for testing
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🧪 Test setup-aur-ssh key filtering
        run: bash .github/actions/aur-setup/test-setup-aur-ssh.sh

  all-required-green: # This job does nothing and is only used for the branch protection
    name: CI Status
    runs-on: ubuntu-slim
    needs:
      - actionlint
      - shell-lint
      - shell-test
      - typos
    if: always()
    steps:
      - name: Check whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            docker
          jobs: ${{ toJSON(needs) }}
